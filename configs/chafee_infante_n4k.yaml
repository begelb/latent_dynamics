# Variant of chafee_infante.yaml with 4x training samples (4000 vs 1000).
# Generates its own data/ and writes to its own output/ to coexist with the base run.
system:
  name: chafee_infante
  params:
    N: 64
    alpha: 28.0
    tau: 0.1
    amplitude: 2.0
    decay: 0.5
arch:
  high_dims: 64
  low_dims: 2
  encoder:
    hidden_shapes:
    - 64
    - 32
    activation: tanh
    out_activation: none
  latent_map:
    hidden_shapes:
    - 32
    - 32
    activation: tanh
    out_activation: none
  decoder:
    hidden_shapes:
    - 32
    - 64
    activation: tanh
    out_activation: none
training:
  learning_rate: 0.003
  batch_size: 30000
  epochs: 4000
  patience: 100
  lr_patience: 10
  loss_weights:
  - 1.0
  - 1.0
  - 0.0
  gradient_clip_norm: null
  scheduler_factor: 0.5
  scheduler_threshold: 0.001
  scheduler_min_lr: 1.0e-06
data:
  sampling_method: uniform
  scaling: none
  n_samples_train: 4000
  n_samples_val: 800
  n_iterations: 30
  skip: 0
  train_seed: 7206
  val_seed: 9999
  train_files: null
cmgdb:
  subdiv_init: 12
  subdiv_min: 16
  subdiv_max: 30
  subdiv_limit: 10000
  bounds_epsilon_frac: 0.01
  lower_bounds: null
  upper_bounds: null
  padding: false
  box_map_backend: auto
  max_table_points: 1200000000
paths:
  data_dir: data/chafee_infante_n4k
  output_dir: output/chafee_infante_n4k
  scaler_dir_override: null
  flat_scaler: false
  read_only: false
seeds:
- 0
