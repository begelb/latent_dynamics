# Seed 0 variant of chafee_infante_test_1101 with finer CMGDB subdivision.
# Same architecture / training / data as the base test_1101 config; only
# `seeds`, `output_dir`, and the cmgdb.subdiv_* values change. The intent is
# to refine the basin geometry and the recurrent Morse-set boxes so the
# very-coarse seed_1 result (4 + 2 = 6 Morse-set boxes, near-vertical
# separator) can be compared against a higher-resolution analysis.
system:
  name: chafee_infante
  params:
    N: 64
    alpha: 28.0
    tau: 0.1
    amplitude: 2.0
    decay: 0.5

arch:
  high_dims: 64
  low_dims: 2
  encoder:
    hidden_shapes: [64, 32]
    activation: tanh
    out_activation: none
  latent_map:
    hidden_shapes: [32, 32]
    activation: tanh
    out_activation: none
  decoder:
    hidden_shapes: [32, 64]
    activation: tanh
    out_activation: none

training:
  learning_rate: 0.003
  batch_size: 30000
  epochs: 4000
  patience: 100
  lr_patience: 10
  loss_weights: [1.0, 1.0, 0.0, 1.0]
  gradient_clip_norm: null
  scheduler_factor: 0.5
  scheduler_threshold: 0.001
  scheduler_min_lr: 0.000001

data:
  sampling_method: uniform
  scaling: none
  n_samples_train: 1000
  n_samples_val: 200
  n_iterations: 30
  skip: 0
  train_seed: 7206
  val_seed: 9999
  train_files: null

cmgdb:
  # Default chafee_infante_test_1101 was init=12, min=16, max=30. Bumping
  # init+min up two levels each: ~16x more cells in 2D, finer recurrent
  # boxes and basin separator while keeping the same upper bound on the
  # adaptive depth.
  subdiv_init: 16
  subdiv_min: 20
  subdiv_max: 30
  subdiv_limit: 10000
  bounds_epsilon_frac: 0.01
  lower_bounds: [-3.0, -2.0]
  upper_bounds: [3.0, 2.0]
  padding: false
  box_map_backend: auto
  max_table_points: 1200000000
  precompute_batch_points: auto
  compute_roa: true
  roa_max_vertices: 50000000

paths:
  data_dir: data/chafee_infante_test_1101
  output_dir: output/chafee_infante_test_1101_seed0_finer
  scaler_dir_override: null
  flat_scaler: false
  read_only: false

seeds: [0]
