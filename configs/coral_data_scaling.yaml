# Coral data-scaling sweep (paper). 30 seeds x {100, 200, 500, 1000, 2000, 5000}.
# Fresh-run config: writes to output/coral_data_scaling/. The preserved Brittany
# artifact tree at replay_sources/coral/train_<N>/seed_<k>/ is kept separately
# as a read-only reference for figure replay.
system:
  name: coral
  params: {}

arch:
  high_dims: 13
  low_dims: 1
  encoder:
    hidden_shapes: [64, 64, 64]
    activation: relu
    out_activation: tanh
  latent_map:
    hidden_shapes: [64, 64, 64]
    activation: relu
    out_activation: tanh
  decoder:
    hidden_shapes: [64, 64, 64]
    activation: relu
    out_activation: sigmoid

training:
  learning_rate: 0.001
  batch_size: 1024
  epochs: 1000
  patience: 100
  lr_patience: 10
  loss_weights: [10, 10, 1]
  gradient_clip_norm: 1.0
  scheduler_factor: 0.1
  scheduler_threshold: 0.001
  scheduler_min_lr: 0.0

data:
  sampling_method: sobol
  scaling: minmax
  n_samples_train: [100, 200, 500, 1000, 2000, 5000]
  n_samples_val: 10000
  n_iterations: 20
  skip: 0
  train_seed: 42
  val_seed: 9999
  train_files: null

cmgdb:
  subdiv_init: 6
  subdiv_min: 8
  subdiv_max: 10
  subdiv_limit: 10000
  bounds_epsilon_frac: 0.01
  lower_bounds: null
  upper_bounds: null
  padding: true
  box_map_backend: auto

paths:
  data_dir: data/coral
  output_dir: output/coral_data_scaling
  scaler_dir_override: null
  flat_scaler: false
  read_only: false

seeds: [0]
