system:
  name: leslie3d
  params:
    th1: 19.6
    th2: 23.68
    th3: 23.68
    survival_p1: 0.7
    survival_p2: 0.7

arch:
  high_dims: 3
  low_dims: 2
  encoder:
    hidden_shapes: [64, 64]
    activation: relu
    out_activation: tanh
  latent_map:
    hidden_shapes: [64, 64]
    activation: relu
    out_activation: tanh
  decoder:
    hidden_shapes: [64, 64]
    activation: relu
    out_activation: sigmoid

training:
  learning_rate: 0.001
  batch_size: 1024
  epochs: 1000
  patience: 100
  lr_patience: 10
  loss_weights: [100, 10, 20]
  gradient_clip_norm: 1.0
  scheduler_factor: 0.1
  scheduler_threshold: 0.001
  scheduler_min_lr: 0.0

data:
  sampling_method: uniform
  scaling: minmax
  n_samples_train: 8000
  n_samples_val: 2000
  n_iterations: 20
  skip: 0
  train_seed: 42
  val_seed: 9999
  train_files: null

cmgdb:
  subdiv_init: 25
  subdiv_min: 28
  subdiv_max: 29
  subdiv_limit: 10000
  bounds_epsilon_frac: 0.01
  lower_bounds: null
  upper_bounds: null
  padding: true
  box_map_backend: auto
  max_table_points: 1200000000

paths:
  data_dir: data/leslie3d_success
  output_dir: output/leslie3d_success
  scaler_dir_override: null
  flat_scaler: false
  read_only: false

seeds: [2]  # selected: bistable latent Morse structure (2 attractors)
