system:
  name: leslie3d
  params:
    th1: 28.9
    th2: 29.8
    th3: 22.0
    survival_p1: 0.7
    survival_p2: 0.7

arch:
  high_dims: 3
  low_dims: 2
  encoder:
    hidden_shapes: [32, 32, 32]
    activation: relu
    out_activation: tanh
  latent_map:
    hidden_shapes: [32, 32, 32]
    activation: relu
    out_activation: tanh
  decoder:
    hidden_shapes: [32, 32, 32]
    activation: relu
    out_activation: sigmoid

training:
  learning_rate: 0.001
  batch_size: 1024
  epochs: 1000
  patience: 100
  lr_patience: 10
  loss_weights: [10, 10, 1]
  gradient_clip_norm: 1.0
  scheduler_factor: 0.1
  scheduler_threshold: 0.001
  scheduler_min_lr: 0.0

data:
  sampling_method: uniform
  scaling: minmax
  n_samples_train: 4000
  n_samples_val: 5000
  n_iterations: 30
  skip: 0
  sobol_train_seed: 42
  sobol_val_seed: 9999
  train_files: null

cmgdb:
  # Matches the saved legacy paper run in output/Leslie_3D/spurious_attractor_ex.
  subdiv_init: 23
  subdiv_min: 23
  subdiv_max: 27
  subdiv_limit: 10000
  bounds_epsilon_frac: 0.01
  lower_bounds: null
  upper_bounds: null
  padding: true
  box_map_backend: auto
  # adaptive_precomputed table at d=2, subdiv_max=27 -> (2^14+1)^2 ~= 2.68e8 corners.
  max_table_points: 300000000

paths:
  data_dir: data/Leslie_3D_larger_domain_tail_only/28.9_29.8_22.0
  output_dir: output/Leslie_3D/spurious_attractor_ex
  scaler_dir_override: output/Leslie_3D/28.9_29.8_22.0/scalers
  flat_scaler: true
  # Preserved paper artifacts; legacy 3-file checkpoint + 94-min CMGDB run.
  # Use --stages render,metrics to replay; --force-overwrite to retrain.
  read_only: true

# Single-checkpoint legacy layout (no seed_<k> subdir).
seeds: []
