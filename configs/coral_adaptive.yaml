# Coral adaptive-sampling sweep (paper). 30 seeds x M in {100, 200, 300, 400, 500}
# adaptive samples on top of a 500-point base. Writes to output/coral_adaptive/.
# The preserved Brittany artifact tree at
# replay_sources/coral/train_500_<M>_adaptive/seed_<k>/ is kept separately as a
# read-only reference for figure replay.
#
# Adaptive sampling requires a trained base model, so the ``data`` stage cannot
# regenerate train_500_<M>_adaptive.csv automatically.
system:
  name: coral
  params: {}

arch:
  high_dims: 13
  low_dims: 1
  encoder:
    hidden_shapes: [64, 64, 64]
    activation: relu
    out_activation: tanh
  latent_map:
    hidden_shapes: [64, 64, 64]
    activation: relu
    out_activation: tanh
  decoder:
    hidden_shapes: [64, 64, 64]
    activation: relu
    out_activation: sigmoid

training:
  learning_rate: 0.001
  batch_size: 1024
  epochs: 1000
  patience: 100
  lr_patience: 10
  loss_weights: [10, 10, 1]
  gradient_clip_norm: 1.0
  scheduler_factor: 0.1
  scheduler_threshold: 0.001
  scheduler_min_lr: 0.0

data:
  sampling_method: adaptive
  scaling: minmax
  n_samples_train: 500
  n_samples_val: 10000
  n_iterations: 20
  skip: 0
  train_seed: 42
  val_seed: 9999
  train_files:
    - train_500_100_adaptive
    - train_500_200_adaptive
    - train_500_300_adaptive
    - train_500_400_adaptive
    - train_500_500_adaptive

cmgdb:
  subdiv_init: 6
  subdiv_min: 8
  subdiv_max: 10
  subdiv_limit: 10000
  bounds_epsilon_frac: 0.01
  lower_bounds: null
  upper_bounds: null
  padding: true
  box_map_backend: auto

paths:
  data_dir: replay_sources/coral/data/coral
  output_dir: output/coral_adaptive
  scaler_dir_override: null
  flat_scaler: false
  read_only: false

seeds: [0]
