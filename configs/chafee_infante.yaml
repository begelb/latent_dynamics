system:
  name: chafee_infante
  params:
    N: 64
    alpha: 28.0
    tau: 0.1
    amplitude: 2.0
    decay: 0.5

arch:
  high_dims: 64
  low_dims: 2
  encoder:
    hidden_shapes: [64, 32]
    activation: tanh
    out_activation: none
  latent_map:
    hidden_shapes: [32, 32]
    activation: tanh
    out_activation: none
  decoder:
    hidden_shapes: [32, 64]
    activation: tanh
    out_activation: none

training:
  learning_rate: 0.003
  batch_size: 30000
  epochs: 4000
  patience: 4000
  lr_patience: 100
  loss_weights: [1.0, 1.0, 0.0]
  gradient_clip_norm: null
  scheduler_factor: 0.5
  scheduler_threshold: 0.0001
  scheduler_min_lr: 0.000001

data:
  sampling_method: uniform
  scaling: none
  n_samples_train: 1000
  n_samples_val: 200
  n_iterations: 30
  skip: 0
  train_seed: 7206
  val_seed: 9999
  train_files: null

cmgdb:
  subdiv_init: 10
  subdiv_min: 14
  subdiv_max: 28
  subdiv_limit: 10000
  bounds_epsilon_frac: 0.01
  lower_bounds: null
  upper_bounds: null
  padding: false
  box_map_backend: auto
  max_table_points: 300000000

paths:
  data_dir: data/chafee_infante
  output_dir: output/chafee_infante
  scaler_dir_override: null
  flat_scaler: false
  read_only: false

seeds: [0]
