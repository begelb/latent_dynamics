# 2D ambient -> 2D latent Leslie test variant matched to the architecture,
# training scale, data volume, and CMGDB settings used in the current
# Chafee-Infante config for comparison.
#
# Loss-weight test 101: reconstruct x_t + latent dynamics, no x_tau
# reconstruction term.
# This variant reuses the original Chafee-like Leslie data; only training
# losses and output artifacts differ across the 011/101/110 tests.
system:
  name: leslie_contraction
  params:
    th1: 20.0
    th2: 20.0
    survival_p1: 0.7
    contraction: 0.25  # unused for 2D
    lower_bounds: [0.0, 0.0]
    upper_bounds: [90.0, 70.0]

arch:
  high_dims: 2
  low_dims: 2
  encoder:
    hidden_shapes: [64, 32]
    activation: tanh
    out_activation: none
  latent_map:
    hidden_shapes: [32, 32]
    activation: tanh
    out_activation: none
  decoder:
    hidden_shapes: [32, 64]
    activation: tanh
    out_activation: none

training:
  learning_rate: 0.003
  batch_size: 30000
  epochs: 4000
  patience: 100
  lr_patience: 10
  loss_weights: [1.0, 0.0, 1.0]
  gradient_clip_norm: null
  scheduler_factor: 0.5
  scheduler_threshold: 0.001
  scheduler_min_lr: 0.000001

data:
  sampling_method: uniform
  scaling: minmax
  n_samples_train: 1000
  n_samples_val: 200
  n_iterations: 30
  skip: 0
  sobol_train_seed: 7206
  sobol_val_seed: 9999
  train_files: null

cmgdb:
  subdiv_init: 22
  subdiv_min: 24
  subdiv_max: 28
  subdiv_limit: 10000
  bounds_epsilon_frac: 0.01
  lower_bounds: null
  upper_bounds: null
  padding: false
  box_map_backend: auto
  max_table_points: 300000000
  precompute_batch_points: auto

paths:
  data_dir: data/leslie2d_to_2d_chafee_like
  output_dir: output/leslie2d_to_2d_test_101
  scaler_dir_override: null
  flat_scaler: false
  read_only: false

seeds: [0, 1]
