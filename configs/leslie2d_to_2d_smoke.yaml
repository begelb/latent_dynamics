# Smoke variant of leslie2d_to_2d.yaml: shorter training schedule and tiny
# CMGDB subdivisions so the full pipeline runs end-to-end in a few minutes,
# used only to validate wiring before scaling to the real subdivisions.
system:
  name: leslie_contraction
  params:
    th1: 20.0
    th2: 20.0
    survival_p1: 0.7
    contraction: 0.25
    lower_bounds: [0.0, 0.0]
    upper_bounds: [90.0, 70.0]

arch:
  num_layers: 2
  hidden_shape: 64
  high_dims: 2
  low_dims: 2

training:
  loss_weights: [100, 10, 20]
  epochs: 80
  patience: 30

data:
  sampling_method: uniform
  n_samples_train: 4000
  n_samples_test: 1000
  n_iterations: 20

cmgdb:
  subdiv_init: 6
  subdiv_min: 10
  subdiv_max: 11
  subdiv_limit: 10000

paths:
  data_dir: data/leslie2d_to_2d_smoke
  output_dir: output/leslie2d_to_2d_smoke

seeds: [0]
