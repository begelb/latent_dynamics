system:
  name: coral
  params: {}

arch:
  high_dims: 13
  low_dims: 1
  encoder:
    hidden_shapes: [64, 32]
    activation: tanh
    out_activation: none
  latent_map:
    hidden_shapes: [32, 32]
    activation: tanh
    out_activation: none
  decoder:
    hidden_shapes: [32, 64]
    activation: tanh
    out_activation: none

training:
  learning_rate: 0.003
  batch_size: 30000
  epochs: 4000
  patience: 100
  lr_patience: 10
  loss_weights: [1.0, 1.0, 0.0]
  gradient_clip_norm: null
  scheduler_factor: 0.5
  scheduler_threshold: 0.001
  scheduler_min_lr: 0.000001

data:
  sampling_method: sobol
  scaling: minmax
  n_samples_train: [5000]
  n_samples_val: 10000
  n_iterations: 20
  skip: 0
  train_seed: 7206
  val_seed: 9999
  train_files: null

cmgdb:
  subdiv_init: 6
  subdiv_min: 8
  subdiv_max: 10
  subdiv_limit: 10000
  bounds_epsilon_frac: 0.01
  lower_bounds: null
  upper_bounds: null
  padding: false
  box_map_backend: auto
  max_table_points: 300000000
  precompute_batch_points: auto

paths:
  data_dir: data/coral
  output_dir: output/coral_basic_test_110
  scaler_dir_override: null
  flat_scaler: false
  read_only: false

seeds: [0]
