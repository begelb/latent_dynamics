# 2D ambient -> 2D latent variant of Patrick's Leslie experiments.
#
# The ambient system is the 2D head of LeslieContraction with Patrick's 2D-base
# parameters (th1=th2=20.0), matching archive/patrick/2D_leslie_base_computation.py.
# Encoder, latent map, and decoder are all 2->2 MLPs so we can isolate the cost
# of evaluating a learned neural map under CMGDB BoxMap from the cost of an
# analytic Leslie evaluation (the 2D base) at otherwise identical settings.
system:
  name: leslie_contraction
  params:
    th1: 20.0
    th2: 20.0
    survival_p1: 0.7
    contraction: 0.25  # unused for 2D
    lower_bounds: [0.0, 0.0]
    upper_bounds: [90.0, 70.0]

arch:
  # Two hidden layers, width 64 (matches Patrick's Leslie3D depth, which is the
  # closest comparator with an analytic ambient map of dim ~ latent dim).
  num_layers: 2
  hidden_shape: 64
  high_dims: 2
  low_dims: 2

training:
  loss_weights: [100, 10, 20]

data:
  sampling_method: uniform
  n_samples_train: 8000
  n_samples_test: 2000
  n_iterations: 20

cmgdb:
  # Matches the analytic 2D base in archive/patrick/2D_leslie_base_computation.py:
  # subdiv_init=16, subdiv_min=23, subdiv_max=24, subdiv_limit=10000. The
  # profile script in scripts/profile_cmgdb_complexity.py will sweep these.
  subdiv_init: 16
  subdiv_min: 23
  subdiv_max: 24
  subdiv_limit: 10000

paths:
  data_dir: data/leslie2d_to_2d
  output_dir: output/leslie2d_to_2d

seeds: [0]
