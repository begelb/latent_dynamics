system:
  name: leslie_contraction
  params:
    th1: 20.0
    th2: 20.0
    survival_p1: 0.7
    contraction: 0.25
    lower_bounds:
    - 0.0
    - 0.0
    upper_bounds:
    - 90.0
    - 70.0
arch:
  high_dims: 2
  low_dims: 2
  encoder:
    hidden_shapes:
    - 64
    - 64
    activation: relu
    out_activation: tanh
  latent_map:
    hidden_shapes:
    - 64
    - 64
    activation: relu
    out_activation: tanh
  decoder:
    hidden_shapes:
    - 64
    - 64
    activation: relu
    out_activation: sigmoid
training:
  learning_rate: 0.001
  batch_size: 1024
  epochs: 1000
  patience: 100
  lr_patience: 10
  loss_weights:
  - 100
  - 10
  - 20
  gradient_clip_norm: 1.0
  scheduler_factor: 0.1
  scheduler_threshold: 0.001
  scheduler_min_lr: 0.0
data:
  sampling_method: uniform
  scaling: minmax
  n_samples_train: 8000
  n_samples_val: 2000
  n_iterations: 20
  skip: 0
  train_seed: 42
  val_seed: 9999
  train_files: null
cmgdb:
  subdiv_init: 16
  subdiv_min: 23
  subdiv_max: 24
  subdiv_limit: 10000
  bounds_epsilon_frac: 0.01
  lower_bounds: null
  upper_bounds: null
  padding: true
  box_map_backend: auto
  max_table_points: 20000000
paths:
  data_dir: data/leslie2d_to_2d
  output_dir: output/leslie2d_to_2d
  scaler_dir_override: null
  flat_scaler: false
  read_only: false
seeds:
- 8
