# Controlled weight warm-start of Patrick's archived Leslie3D Example 2 model.
#
# This reuses the already generated 4x uniform dataset (32k/8k initial
# conditions, 20 transitions each) while preserving the exact archived scaler
# coordinates expected by Patrick's weights. Never include `scale` in this
# experiment's stage list: scaler_read_only makes such an attempt fail closed.
system:
  name: leslie3d
  params:
    th1: 28.9
    th2: 29.8
    th3: 22.0
    survival_p1: 0.7
    survival_p2: 0.7

arch:
  high_dims: 3
  low_dims: 2
  encoder:
    hidden_shapes: [64, 64]
    activation: relu
    out_activation: tanh
  latent_map:
    hidden_shapes: [64, 64]
    activation: relu
    out_activation: tanh
  decoder:
    hidden_shapes: [64, 64]
    activation: relu
    out_activation: sigmoid

training:
  # One tenth of the reconstructed from-scratch learning rate. Adam and the
  # scheduler start fresh; only Patrick's model weights are loaded.
  learning_rate: 0.0001
  batch_size: 1024
  epochs: 300
  patience: 50
  lr_patience: 10
  loss_weights: [100, 10, 20]
  gradient_clip_norm: 1.0
  scheduler_factor: 0.1
  scheduler_threshold: 0.001
  scheduler_min_lr: 0.0
  warm_start_checkpoint_dir: replay_sources/leslie3d_example2/models

data:
  sampling_method: uniform
  scaling: minmax
  n_samples_train: 32000
  n_samples_val: 8000
  n_iterations: 20
  skip: 0
  train_seed: 42
  val_seed: 9999
  train_files: null

cmgdb:
  subdiv_init: 25
  subdiv_min: 28
  subdiv_max: 29
  subdiv_limit: 10000
  bounds_epsilon_frac: 0.01
  lower_bounds: null
  upper_bounds: null
  padding: true
  box_map_backend: auto
  precompute_batch_points: auto
  compute_roa: false
  roa_max_vertices: 50000000
  collapse_roa_to_lca: true

paths:
  # Generated by leslie3d_example2_large_data_4x; make_data validates its
  # metadata and leaves matching files untouched.
  data_dir: data/leslie3d_example2_large_data_4x
  output_dir: output/leslie3d_example2_patrick_finetune_4x
  scaler_dir_override: replay_sources/leslie3d_example2/data/scalers
  flat_scaler: true
  scaler_read_only: true
  read_only: false

# The warm-start weights are identical for all cells. These seeds control
# minibatch shuffling and subsequent stochastic operations, yielding three
# controlled fine-tuning repeats rather than three random initializations.
seeds: [0, 1, 2]
experiment_name: leslie3d_example2_patrick_finetune_4x
