system:
  name: leslie3d
  params:
    th1: 28.9
    th2: 29.8
    th3: 22.0
    survival_p1: 0.7
    survival_p2: 0.7

arch:
  high_dims: 3
  low_dims: 2
  encoder:
    hidden_shapes: [64, 64]
    activation: relu
    out_activation: tanh
  latent_map:
    hidden_shapes: [64, 64]
    activation: relu
    out_activation: tanh
  decoder:
    hidden_shapes: [64, 64]
    activation: relu
    out_activation: sigmoid

# This run does not retrain. Its models directory contains byte-identical
# copies of Patrick's three archived legacy checkpoint files.
training:
  learning_rate: 0.001
  batch_size: 1024
  epochs: 1000
  patience: 100
  lr_patience: 10
  loss_weights: [100, 10, 20]
  gradient_clip_norm: 1.0
  scheduler_factor: 0.1
  scheduler_threshold: 0.001
  scheduler_min_lr: 0.0

# The original training CSVs were not archived. These values and the current
# Leslie Example2 CSV paths support diagnostic rendering and provenance,
# while fixed archived CMGDB bounds make data inference irrelevant to the graph.
data:
  sampling_method: uniform
  scaling: minmax
  n_samples_train: 8000
  n_samples_val: 2000
  n_iterations: 20
  skip: 0
  train_seed: 42
  val_seed: 9999
  train_files: null

# One binary subdivision level coarser than Patrick's archived 25/28/29 run.
# `auto` resolves to `adaptive_precomputed` for this nonuniform ladder.
cmgdb:
  subdiv_init: 24
  subdiv_min: 27
  subdiv_max: 28
  subdiv_limit: 10000
  bounds_epsilon_frac: 0.01
  lower_bounds: [-0.37490714, -0.4695556]
  upper_bounds: [0.3535685, 0.455769]
  padding: true
  box_map_backend: auto
  precompute_batch_points: auto
  compute_roa: false
  roa_max_vertices: 50000000
  collapse_roa_to_lca: true

paths:
  data_dir: data/leslie3d_example2
  output_dir: output/leslie3d_example2_patrick_coarser_s24_27_28
  scaler_dir_override: replay_sources/leslie3d_example2/data/scalers
  flat_scaler: true
  read_only: false

# Patrick's archived run has no seed directory; preserve that flat layout.
seeds: []
experiment_name: leslie3d_example2_patrick_coarser_s24_27_28
