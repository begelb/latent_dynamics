# Leslie3D 2D latent model on the absorbing box used by the direct ground-truth
# computation.  The 3x5 launcher replaces train_seed for each data realization
# and keeps this first frozen seed as the packaged single-dataset default.
system:
  name: leslie3d
  params:
    th1: 28.9
    th2: 29.8
    th3: 22.0
    survival_p1: 0.7
    survival_p2: 0.7
    lower_bounds: [0.0, 0.0, 0.0]
    upper_bounds: [110.0, 77.0, 54.0]

arch:
  high_dims: 3
  low_dims: 2
  encoder:
    hidden_shapes: [128, 64]
    activation: tanh
    out_activation: none
  latent_map:
    hidden_shapes: [64, 64]
    activation: tanh
    out_activation: none
  decoder:
    hidden_shapes: [64, 128]
    activation: tanh
    out_activation: none

# The dedicated curriculum trainer performs exactly one full-batch AdamW update
# per first-order epoch and keeps its moment state across all three stages.  A
# fresh final L-BFGS optimizer then polishes the joint objective on CPU float64;
# the exact endpoint is cast to float32 for CMGDB.  Neither phase uses holdout
# selection, scheduling, patience, clipping, or best-weight restoration.
training:
  learning_rate: 0.003
  batch_size: 20000
  epochs: 12000
  patience: 12001
  lr_patience: 100
  loss_weights: [1, 1, 1]
  gradient_clip_norm: null
  scheduler_factor: 0.5
  scheduler_threshold: 0.0001
  scheduler_min_lr: 0.000001
  curriculum_optimizer:
    name: adamw
    betas: [0.9, 0.999]
    eps: 0.00000001
    # Zero decay keeps the fitted objective exactly L1+L2+L3.  This matches the
    # local AdamW/L-BFGS implementation precedent; nonzero decay would add a
    # regularizer that the subsequent unregularized L-BFGS phase does not share.
    weight_decay: 0.0
    amsgrad: false
    foreach: false
    fused: false
  curriculum:
    - name: autoencoder
      epochs: 4000
      learning_rate: 0.003
      loss_weights: [1, 0, 0]
      trainable_components: [encoder, decoder]
    - name: decoded_prediction
      epochs: 4000
      learning_rate: 0.003
      loss_weights: [1, 1, 0]
      trainable_components: [encoder, latent_map, decoder]
    - name: semiconjugacy
      epochs: 4000
      learning_rate: 0.003
      loss_weights: [1, 1, 1]
      trainable_components: [encoder, latent_map, decoder]
  curriculum_polish:
    name: lbfgs
    device: cpu
    dtype: float64
    outer_steps: 12
    learning_rate: 0.25
    max_iter: 10
    max_eval: 25
    history_size: 50
    tolerance_grad: 0.000000001
    tolerance_change: 0.000000000001
    line_search_fn: strong_wolfe
    loss_weights: [1, 1, 1]
    trainable_components: [encoder, latent_map, decoder]

data:
  sampling_method: uniform
  scaling: minmax
  n_samples_train: 1000
  n_samples_val: 200
  n_iterations: 20
  skip: 0
  train_seed: 2158
  val_seed: 9999
  train_files: null

# The latent rectangle is inferred from encoded current and next states in the
# training data only, then enlarged by one percent.  Validation remains a
# reporting-only holdout and does not determine the Morse domain.
cmgdb:
  subdiv_init: 25
  subdiv_min: 28
  subdiv_max: 29
  subdiv_limit: 10000
  bounds_epsilon_frac: 0.01
  lower_bounds: null
  upper_bounds: null
  padding: true
  box_map_backend: adaptive_precomputed
  bounds_data_role: train_pairs
  adaptive_precompute_subdiv: init
  precompute_batch_points: auto
  compute_roa: false
  roa_max_vertices: 50000000
  collapse_roa_to_lca: true

paths:
  data_dir: data/leslie3d_groundbox_curriculum_wide
  output_dir: output/leslie3d_groundbox_curriculum_wide
  scaler_dir_override: null
  flat_scaler: false
  scaler_read_only: false
  read_only: false

seeds: [0, 1, 2]
experiment_name: leslie3d_groundbox_curriculum_wide
