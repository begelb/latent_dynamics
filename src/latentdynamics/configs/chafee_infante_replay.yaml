system:
  name: chafee_infante
  params:
    N: 64
    alpha: 28.0
    tau: 0.1
    amplitude: 2.0
    decay: 0.5
arch:
  high_dims: 64
  low_dims: 2
  encoder:
    hidden_shapes:
    - 64
    - 32
    activation: tanh
    out_activation: none
  latent_map:
    hidden_shapes:
    - 32
    - 32
    activation: tanh
    out_activation: none
  decoder:
    hidden_shapes:
    - 32
    - 64
    activation: tanh
    out_activation: none
training:
  learning_rate: 0.003
  batch_size: 30000
  epochs: 4000
  patience: 4000
  lr_patience: 100
  loss_weights:
  - 1.0
  - 1.0
  - 0.0
  gradient_clip_norm: null
  scheduler_factor: 0.5
  scheduler_threshold: 0.0001
  scheduler_min_lr: 1.0e-06
data:
  sampling_method: uniform
  scaling: none
  n_samples_train: 1000
  n_samples_val: 200
  n_iterations: 30
  skip: 0
  train_seed: 7206
  val_seed: 9999
  train_files: null
# This block replays the saved package reference computation (10, 14, 28)
# with fixed bounds. It is NOT the production d=2 computation of paper
# tab:cmgdb, which used subdivisions (14, 16, 22) with data-derived bounds
# plus 10 percent per-axis padding (see chafee_infante.yaml).
cmgdb:
  subdiv_init: 10
  subdiv_min: 14
  subdiv_max: 28
  subdiv_limit: 10000
  bounds_epsilon_frac: 0.01
  lower_bounds:
  - -3.0
  - -2.0
  upper_bounds:
  - 3.0
  - 2.0
  padding: false
  box_map_backend: auto
  compute_roa: true
# Read-only replay of the reference trained model; the original
# ci_model_weights.pth was converted externally to the package checkpoint format
# under replay_sources/chafee_infante/replay/. Recompute CMGDB on this model with
# `--stages render,metrics` (the morse_graph / morse_sets are already saved
# here). The training block above documents the recipe but is not run for the
# replay.
paths:
  data_dir: data/chafee_infante
  output_dir: replay_sources/chafee_infante/replay
  scaler_dir_override: null
  flat_scaler: false
  read_only: true
seeds: []
