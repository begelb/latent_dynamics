# Guarded encoder/decoder chart refinement followed by latent-map repair.
#
# scripts/train_leslie3d_alternating_chart.py verifies the exact accepted
# primary-v2 checkpoint hash before training.  This output is isolated from
# every frozen-chart and subdivision audit.  Post-chart CMGDB bounds are
# intentionally recomputed; the old fixed-chart rectangle is no longer valid.
system:
  name: leslie3d
  params:
    th1: 28.9
    th2: 29.8
    th3: 22.0
    survival_p1: 0.7
    survival_p2: 0.7

arch:
  high_dims: 3
  low_dims: 2
  encoder:
    hidden_shapes: [64, 64]
    activation: relu
    out_activation: tanh
  latent_map:
    hidden_shapes: [64, 64]
    activation: gelu
    out_activation: tanh
  decoder:
    hidden_shapes: [64, 64]
    activation: relu
    out_activation: sigmoid

training:
  # Conservative interior-map rate used by the post-failure topology-first retry.
  learning_rate: 0.00000005
  batch_size: 65536
  epochs: 4000
  patience: 1200
  lr_patience: 300
  loss_weights: [100, 20, 100, 20]
  gradient_clip_norm: 1.0
  scheduler_factor: 0.2
  scheduler_threshold: 0.000001
  scheduler_min_lr: 0.000000005
  warm_start_checkpoint_dir: output/leslie3d_invariant_aware_v2_smooth/seed_20260809/models

data:
  sampling_method: uniform
  scaling: minmax
  n_samples_train: 45512
  n_samples_val: 20661
  n_iterations: 1
  skip: 0
  train_seed: 20260807
  val_seed: 20260808
  train_files: null

cmgdb:
  subdiv_init: 20
  subdiv_min: 25
  subdiv_max: 30
  subdiv_limit: 10000
  bounds_epsilon_frac: 0.02
  lower_bounds: null
  upper_bounds: null
  padding: true
  box_map_backend: adaptive_precomputed
  max_table_points: 1200000000
  precompute_batch_points: auto
  compute_roa: false
  roa_max_vertices: 50000000
  collapse_roa_to_lca: true

paths:
  data_dir: data/leslie3d_invariant_aware_v2
  output_dir: output/leslie3d_invariant_aware_v2_alternating
  scaler_dir_override: replay_sources/leslie3d_example2/data/scalers
  flat_scaler: true
  scaler_read_only: true
  read_only: false

seeds: [20260811]
experiment_name: leslie3d_invariant_aware_v2_alternating
