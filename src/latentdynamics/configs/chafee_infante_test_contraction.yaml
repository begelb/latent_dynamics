# Chafee-Infante with the leslie_contraction-style architecture: deeper
# [64,64,64,64] relu MLPs, tanh-bounded latent, sigmoid decoder, minmax scaling.
# Exploratory -- multiple seeds, separate output dir (does not touch the
# baseline chafee_infante run). CMGDB starts moderate (25/27/28); refine the
# best seed to finer subdivision (27/29/30) if orbits look merged.
system:
  name: chafee_infante
  params:
    N: 64
    alpha: 28.0
    tau: 0.1
    amplitude: 2.0
    decay: 0.5

arch:
  high_dims: 64
  low_dims: 2
  encoder:
    hidden_shapes: [64, 64, 64, 64]
    activation: relu
    out_activation: tanh
  latent_map:
    hidden_shapes: [64, 64, 64, 64]
    activation: relu
    out_activation: tanh
  decoder:
    hidden_shapes: [64, 64, 64, 64]
    activation: relu
    out_activation: sigmoid

training:
  learning_rate: 0.001
  batch_size: 1024
  epochs: 1000
  patience: 100
  lr_patience: 10
  loss_weights: [100, 10, 20]
  gradient_clip_norm: 1.0
  scheduler_factor: 0.1
  scheduler_threshold: 0.001
  scheduler_min_lr: 0.0

data:
  sampling_method: uniform
  scaling: minmax
  n_samples_train: 2000
  n_samples_val: 500
  n_iterations: 30
  skip: 0
  train_seed: 7206
  val_seed: 9999
  train_files: null

cmgdb:
  subdiv_init: 25
  subdiv_min: 27
  subdiv_max: 28
  subdiv_limit: 10000
  bounds_epsilon_frac: 0.01
  lower_bounds: null
  upper_bounds: null
  padding: true
  box_map_backend: auto

paths:
  data_dir: data/chafee_infante_test_contraction
  output_dir: output/chafee_infante_test_contraction
  scaler_dir_override: null
  flat_scaler: false
  read_only: false

seeds: [0, 1, 2, 3]
