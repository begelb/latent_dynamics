# Ives et al. Lake Mývatn midge--algae--detritus map in log10
# coordinates.  The 3x5 launcher replaces train_seed with the other four
# frozen data-realization seeds and isolates each model seed below.
experiment_name: ives_myvatn

system:
  name: ives
  params:
    coordinate_mode: log
    r1: 3.873
    r2: 11.746
    # Decimal spelling of 10**-6.435; do not replace with the rounded 3.68e-7
    # value found in the archived JSON configuration.
    c: 0.000000367282300498085
    d: 0.5517
    p: 0.06659
    q: 0.9026
    lower_bounds: [-3.0, -7.5, -3.0]
    upper_bounds: [1.5, 1.5, 1.5]

arch:
  high_dims: 3
  low_dims: 2
  encoder:
    hidden_shapes: [32]
    activation: relu
    out_activation: tanh
  latent_map:
    hidden_shapes: [64, 64, 64, 64, 64]
    activation: relu
    out_activation: tanh
  decoder:
    hidden_shapes: [32]
    activation: relu
    out_activation: sigmoid

# The generic trainer implements Adam, validation-based best-checkpoint
# selection, early stopping, and ReduceLROnPlateau.  No curriculum, warm
# start, separation penalty, or gradient clipping is enabled.
training:
  learning_rate: 0.001
  batch_size: 1024
  epochs: 500
  patience: 300
  lr_patience: 20
  loss_weights: [1, 1, 1]
  gradient_clip_norm: null
  scheduler_factor: 0.5
  scheduler_threshold: 0.0001
  scheduler_min_lr: 0.000001
  warm_start_checkpoint_dir: null

# n_iterations is the final generated time and skip is the discarded
# transient: each initial condition contributes 70 - 50 = 20 saved pairs.
# fixed_bounds reproduces the archive's explicit affine normalization instead
# of fitting a MinMax scaler to each sampled dataset.
data:
  sampling_method: uniform
  scaling: fixed_bounds
  scaling_epsilon: 0.000001
  n_samples_train: 1000
  n_samples_val: 200
  n_iterations: 70
  skip: 50
  train_seed: 2158
  val_seed: 9999
  train_files: null

# Reconstruct the canonical script's bound source: encode a 64^3 grid over
# the physical system box, include its latent image, expand by 10%, then clip
# to the tanh square.  Only the level-18 table is dense-precomputed.
cmgdb:
  subdiv_init: 18
  subdiv_min: 22
  subdiv_max: 30
  subdiv_limit: 100000
  bounds_epsilon_frac: 0.1
  lower_bounds: null
  upper_bounds: null
  padding: true
  box_map_backend: adaptive_precomputed
  bounds_data_role: system_grid
  bounds_grid_resolution: 64
  bounds_include_latent_image: true
  bounds_clip_lower: [-1.0, -1.0]
  bounds_clip_upper: [1.0, 1.0]
  adaptive_precompute_subdiv: init
  precompute_batch_points: auto
  compute_roa: false
  roa_max_vertices: 50000000
  collapse_roa_to_lca: true

paths:
  data_dir: data/ives_myvatn
  output_dir: output/ives_myvatn
  scaler_dir_override: null
  flat_scaler: false
  scaler_read_only: false
  read_only: false

seeds: [0, 1, 2]
