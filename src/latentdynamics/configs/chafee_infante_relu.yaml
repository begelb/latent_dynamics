# Recommended chafee_infante deliverable: relu MLP architecture that robustly
# reproduces the CORRECT 2 attractor Morse sets (u+/u-), unlike the baseline
# chafee_infante.yaml (tanh, scaling none) which overcounts to 4-5 spurious
# attractors. From the architecture sweep (scratch/chafee_arch_sweep.py): relu_mlp
# gave 2 attractors in all 4 seeds (0-3); seed 3 is staged in paper_figures.
# Validated: the true equilibria u+/u- encode into the 2 distinct attractors.
system:
  name: chafee_infante
  params:
    N: 64
    alpha: 28.0
    tau: 0.1
    amplitude: 2.0
    decay: 0.5
arch:
  high_dims: 64
  low_dims: 2
  encoder:
    hidden_shapes: [64, 64]
    activation: relu
    out_activation: none
  latent_map:
    hidden_shapes: [32, 32]
    activation: relu
    out_activation: none
  decoder:
    hidden_shapes: [64, 64]
    activation: relu
    out_activation: none
training:
  learning_rate: 0.003
  batch_size: 30000
  epochs: 4000
  patience: 500
  lr_patience: 100
  loss_weights: [1, 1, 0]
  gradient_clip_norm: null
  scheduler_factor: 0.5
  scheduler_threshold: 0.0001
  scheduler_min_lr: 0.000001
data:
  sampling_method: uniform
  scaling: none
  n_samples_train: 1000
  n_samples_val: 200
  n_iterations: 30
  skip: 0
  train_seed: 7206
  val_seed: 9999
  train_files: null
cmgdb:
  # 10/14/28 (the reference subdivision). Finer subdivision overcounts attractors here
  # (14/20/28 -> 4); trivial-index nodes are seed-dependent, not subdiv-fixable.
  subdiv_init: 10
  subdiv_min: 14
  subdiv_max: 28
  subdiv_limit: 10000
  bounds_epsilon_frac: 0.01
  lower_bounds: null
  upper_bounds: null
  padding: false
  box_map_backend: auto
  max_table_points: 300000000
paths:
  data_dir: data/chafee_infante
  output_dir: output/chafee_infante_relu
  scaler_dir_override: null
  flat_scaler: false
  read_only: false
seeds: [3]  # all of 0-3 give the correct 2 attractors; seed 3 staged for the paper
