system:
  name: leslie3d
  params:
    th1: 28.9
    th2: 29.8
    th3: 22.0
    survival_p1: 0.7
    survival_p2: 0.7
arch:
  high_dims: 3
  low_dims: 2
  encoder:
    hidden_shapes:
    - 32
    - 32
    - 32
    activation: relu
    out_activation: tanh
  latent_map:
    hidden_shapes:
    - 32
    - 32
    - 32
    activation: relu
    out_activation: tanh
  decoder:
    hidden_shapes:
    - 32
    - 32
    - 32
    activation: relu
    out_activation: sigmoid
training:
  learning_rate: 0.001
  batch_size: 1024
  epochs: 1000
  patience: 100
  lr_patience: 10
  loss_weights:
  - 10
  - 10
  - 1
  gradient_clip_norm: 1.0
  scheduler_factor: 0.1
  scheduler_threshold: 0.001
  scheduler_min_lr: 0.0
data:
  sampling_method: uniform
  scaling: minmax
  n_samples_train: 3200
  n_samples_val: 800
  n_iterations: 30
  skip: 10
  train_seed: 42
  val_seed: 9999
  train_files: null
cmgdb:
  subdiv_init: 23
  subdiv_min: 23
  subdiv_max: 27
  subdiv_limit: 10000
  bounds_epsilon_frac: 0.01
  lower_bounds: null
  upper_bounds: null
  padding: true
  box_map_backend: auto
paths:
  data_dir: data/leslie3d_example1
  output_dir: replay_sources/leslie3d_example1/spurious_attractor_ex
  scaler_dir_override: replay_sources/leslie3d_example1/28.9_29.8_22.0/scalers
  flat_scaler: true
  read_only: true
seeds: []
