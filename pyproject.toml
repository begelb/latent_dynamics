[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latentdynamics"
version = "0.1.0"
description = "Characterizing high-dimensional dynamics by combinatorial-topological methods on a latent space."
readme = "README.md"
requires-python = ">=3.11.4,<3.14"
license = "MIT"
authors = [
    { name = "Patrick Bailon" },
    { name = "Marcio Gameiro" },
    { name = "Brittany Gelb" },
    { name = "William Kalies" },
    { name = "Miroslav Kramar" },
    { name = "Konstantin Mischaikow" },
    { name = "Bernardo Rivas" },
    { name = "Ewerton Vieira" },
]

dependencies = [
    # Floors below are the oldest release carrying an API this package uses,
    # not a snapshot of any one development machine. No module compares a
    # runtime version; torch.__version__ and scipy.__version__ are recorded
    # into run provenance only.
    #   torch  2.0  -- torch.load(weights_only=...) (1.13) and the torch.mps
    #                  namespace (1.12) are the newest APIs used.
    #   numpy  1.26 -- the code uses no numpy-2-only API and no name numpy 2
    #                  removed, so it runs on both 1.26.x and 2.x. Keeping the
    #                  floor below 2.0 matters on macOS x86_64, where the last
    #                  available torch (2.2.2) is built against the numpy 1 ABI
    #                  and aborts under numpy 2.
    "torch>=2.0",
    "numpy>=1.26",
    # macOS x86_64 has no torch wheel past 2.2.2, and that build predates
    # numpy 2.0 -- under numpy 2 it aborts with "Failed to initialize NumPy:
    # _ARRAY_API not found" and every .numpy()/from_numpy call raises. torch
    # declares no numpy constraint of its own, so the resolver would otherwise
    # happily pick torch 2.2.2 alongside numpy 2.x. Other platforms are
    # unaffected and resolve to current numpy.
    "numpy<2; platform_system == 'Darwin' and platform_machine == 'x86_64'",
    "pandas>=2.0",
    "matplotlib>=3.8",
    # Only sklearn.preprocessing.MinMaxScaler and long-stable scipy submodules
    # (integrate, optimize, sparse.csgraph, spatial, stats) are used.
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "tqdm>=4.67",
    "joblib>=1.5",
    "pydot>=4.0",
    "pydantic>=2.9",
    # Basin/reachability post-processing (regions-of-attraction overlays).
    "networkx>=3.0",
    # Geometry for 2-D attracting-block tolerance searches.
    "shapely>=2.0",
    # Geometry-preserving PDF recoloring (scripts/recolor_chafee_pdf.py).
    "pypdf>=4.0",
    # Memory headroom checks in the Chafee d=3 on-demand controller
    # (scripts/run_chafee_d3_ondemand_5x3_controller.py). Imported at module
    # scope, so test collection fails without it.
    "psutil>=5.9",
    # Conley-Morse graph computations. 1.5.0 carries everything this project
    # needs: the cache_map_graph kwarg (cached returned map_graph), automatic
    # CSR edge reservation, the Morse-reduction Conley fiber preboundary, and
    # the native reachability queries (MorseReachabilityMasks,
    # MorseSingletonReachability, MorseDirectedPathCells,
    # ComputeConleyIndexForCells).
    "cmgdb>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    # Headless notebook execution (CI checks the reader-facing notebooks).
    "nbconvert>=7.16",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
latentdynamics = ["configs/*.yaml", "reference_data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: end-to-end smoke or integration tests (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "RUF"]
ignore = [
    "E501",
    # Scientific code naturally uses names such as X, Y, N, and G for
    # coordinate arrays, dimensions, and graph maps.
    "N803",
    "N806",
]
