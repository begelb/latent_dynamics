[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latentdynamics"
version = "0.1.0"
description = "Characterizing high-dimensional dynamics by combinatorial-topological methods on a latent space."
readme = "README.md"
requires-python = ">=3.11.4,<3.14"
license = "MIT"
authors = [
    { name = "Patrick Bailon" },
    { name = "Marcio Gameiro" },
    { name = "Brittany Gelb" },
    { name = "William Kalies" },
    { name = "Miroslav Kramar" },
    { name = "Konstantin Mischaikow" },
    { name = "Bernardo Rivas" },
    { name = "Ewerton Vieira" },
]

dependencies = [
    "torch>=2.11",
    "numpy>=2.0",
    "pandas>=2.0",
    "matplotlib>=3.10",
    "scikit-learn>=1.8",
    "scipy>=1.17",
    "pyyaml>=6.0",
    "tqdm>=4.67",
    "joblib>=1.5",
    "pydot>=4.0",
    "pydantic>=2.9",
    # Basin/reachability post-processing (regions-of-attraction overlays).
    "networkx>=3.0",
    # Geometry for 2-D attracting-block tolerance searches.
    "shapely>=2.0",
    # Geometry-preserving PDF recoloring (scripts/recolor_chafee_pdf.py).
    "pypdf>=4.0",
    # The maintained CMGDB fork is not on PyPI. uv resolves the pin through
    # the flat 'cmgdb-wheels' index below; with plain pip, install the
    # prebuilt wheel first:
    #   pip install cmgdb==1.3.3+fork.3 --find-links \
    #     https://github.com/bernardorivas/CMGDB/releases/expanded_assets/v1.3.3%2Bfork.3
    # The local version segment keeps the pin unambiguous even if a release
    # with the same public version appears on PyPI.
    "cmgdb==1.3.3+fork.3",
]

[[tool.uv.index]]
name = "cmgdb-wheels"
url = "https://github.com/bernardorivas/CMGDB/releases/expanded_assets/v1.3.3%2Bfork.3"
format = "flat"
explicit = true

[tool.uv.sources]
cmgdb = { index = "cmgdb-wheels" }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    # Headless notebook execution (CI checks the reader-facing notebooks).
    "nbconvert>=7.16",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
latentdynamics = ["configs/*.yaml", "reference_data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: end-to-end smoke or integration tests (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "RUF"]
ignore = [
    "E501",
    # Scientific code naturally uses names such as X, Y, N, and G for
    # coordinate arrays, dimensions, and graph maps.
    "N803",
    "N806",
]
