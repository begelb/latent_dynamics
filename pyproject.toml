[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latentdynamics"
version = "0.1.0"
description = "Rigorously characterizing high-dimensional dynamics by combinatorial-topological methods on a latent space."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Brittany Gelb" },
    { name = "Patrick Bailon" },
    { name = "Marcio Gameiro" },
    { name = "Bill Kalies" },
    { name = "Konstantin Mischaikow" },
    { name = "Miro Kramar" },
    { name = "Bernardo Rivas", email = "bernardo.apr@gmail.com" },
]

dependencies = [
    "torch>=2.11",
    "numpy>=2.0",
    "pandas>=2.0",
    "matplotlib>=3.10",
    "scikit-learn>=1.8",
    "scipy>=1.17",
    "pyyaml>=6.0",
    "tqdm>=4.67",
    "joblib>=1.5",
    "pydot>=4.0",
    "pydantic>=2.9",
    # Bernardo fork; tracks master HEAD (unpinned).
    "CMGDB @ git+https://github.com/bernardorivas/CMGDB.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
latentdynamics = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: end-to-end smoke or integration tests (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "RUF"]
ignore = [
    "E501",
    # Scientific code naturally uses names such as X, Y, N, and G for
    # coordinate arrays, dimensions, and graph maps.
    "N803",
    "N806",
]
