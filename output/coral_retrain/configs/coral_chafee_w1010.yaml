system:
  name: coral
  params: {}

arch:
  high_dims: 13
  low_dims: 1
  encoder:
    hidden_shapes: [64, 64, 64]
    activation: relu
    out_activation: tanh
  latent_map:
    hidden_shapes: [64, 64, 64]
    activation: relu
    out_activation: tanh
  decoder:
    hidden_shapes: [64, 64, 64]
    activation: relu
    out_activation: sigmoid

training:                          # <-- Chafee-Infante training recipe, cloned
  learning_rate: 0.003
  batch_size: 2000                 # full batch (train_100.csv = 2000 pairs)
  epochs: 4000
  patience: 4000                   # no early stopping
  lr_patience: 100
  loss_weights: [10, 10, 1]        # coral's tuned objective (semiconjugacy kept)
  gradient_clip_norm: null
  scheduler_factor: 0.5
  scheduler_threshold: 0.0001
  scheduler_min_lr: 0.000001

data:
  sampling_method: sobol
  scaling: minmax
  n_samples_train: [100]
  n_samples_val: 10000
  n_iterations: 20
  skip: 0
  train_seed: 42
  val_seed: 9999
  train_files: null

cmgdb:
  subdiv_init: 8
  subdiv_min: 8
  subdiv_max: 12
  subdiv_limit: 10000
  bounds_epsilon_frac: 0.01
  lower_bounds: null
  upper_bounds: null
  padding: true
  box_map_backend: auto

paths:
  data_dir: /Users/bdoprad/Work/Projects/latent-dynamics/code/output/coral_retrain/data/size
  output_dir: /Users/bdoprad/Work/Projects/latent-dynamics/code/output/coral_retrain/ablation_chafee_w1010/size
  scaler_dir_override: /Users/bdoprad/Work/Projects/latent-dynamics/code/output/coral_retrain/data/scalers
  flat_scaler: false
  read_only: false

seeds: [0, 1, 2]
