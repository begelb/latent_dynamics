# Smooth-transition continuation for the invariant-aware Leslie3D v2 data.
#
# scripts/train_leslie3d_smooth_topology.py keeps the already-audited v1 chart
# fixed and continues its smooth latent map on the stronger v2 transition
# inventory. Reusing the chart keeps the CMGDB rectangle and all encoded
# invariant landmarks directly comparable across the v1 and v2 experiments.
system:
  name: leslie3d
  params:
    th1: 28.9
    th2: 29.8
    th3: 22.0
    survival_p1: 0.7
    survival_p2: 0.7

arch:
  high_dims: 3
  low_dims: 2
  encoder:
    hidden_shapes: [64, 64]
    activation: relu
    out_activation: tanh
  latent_map:
    hidden_shapes: [64, 64]
    activation: gelu
    out_activation: tanh
  decoder:
    hidden_shapes: [64, 64]
    activation: relu
    out_activation: sigmoid

training:
  learning_rate: 0.00005
  batch_size: 65536
  epochs: 12000
  patience: 2500
  lr_patience: 400
  loss_weights: [100, 20, 100, 20]
  gradient_clip_norm: 1.0
  scheduler_factor: 0.2
  scheduler_threshold: 0.000001
  scheduler_min_lr: 0.000000005
  warm_start_checkpoint_dir: output/leslie3d_invariant_aware/seed_20260803/models

data:
  # Build data/leslie3d_invariant_aware_v2 with the standalone v2 builder.
  # The smooth trainer consumes those analytic pairs directly.
  sampling_method: uniform
  scaling: minmax
  n_samples_train: 45512
  n_samples_val: 20661
  n_iterations: 1
  skip: 0
  train_seed: 20260807
  val_seed: 20260808
  train_files: null

cmgdb:
  subdiv_init: 20
  subdiv_min: 24
  subdiv_max: 26
  subdiv_limit: 10000
  bounds_epsilon_frac: 0.02
  # Audited chart bounds from the invariant-aware encoded recurrent inventory.
  lower_bounds: [-0.34096482396125793, -0.2952786684036255]
  upper_bounds: [0.25832921266555786, 0.41028958559036255]
  padding: true
  box_map_backend: adaptive_precomputed
  precompute_batch_points: auto
  compute_roa: false
  roa_max_vertices: 50000000
  collapse_roa_to_lca: true

paths:
  data_dir: data/leslie3d_invariant_aware_v2
  output_dir: output/leslie3d_invariant_aware_v2_smooth
  scaler_dir_override: replay_sources/leslie3d_example2/data/scalers
  flat_scaler: true
  scaler_read_only: true
  read_only: false

seeds: [20260809]
experiment_name: leslie3d_invariant_aware_v2_smooth
